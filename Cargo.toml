[package]
name = "luma_rust"
version = "1.0.0"
edition = "2024"

# Package keeps its name; the command users type is `luma`.
[[bin]]
name = "luma"
path = "src/main.rs"

[dependencies]
walkdir = "2"
anyhow = "1"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
notify = "8"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the settings menu lists and rewrites keys in the file's own order
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
evalexpr = "13"
# CLIP-эмбеддинги (модели в ~/.config/luma/models/clip/): пример и модуль src/backend/files/clip.rs
ort = "2.0.0-rc.14"
ndarray = "0.17"
image = "0.25"
tokenizers = "0.21"
# malloc_trim: вернуть ОС страницы, освобождённые дропом vision-сессии
libc = "0.2"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
strip = true
lto = "thin"
