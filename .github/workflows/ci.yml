name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      speech:
        description: Also run the speech model on real speech (downloads ~66 MB)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Same environment as release.yml (oldest supported glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++ pkg-config \
            libnuma-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev libxcb1-dev ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      # The binary must run on Ubuntu 22.04 / Linux Mint 21 (glibc 2.35). Weak symbols
      # (pidfd_*) are optional and ignored. ldd in a clean 22.04 container catches missing libs.
      - name: glibc floor (22.04)
        run: |
          max=$(objdump -T target/debug/luma | grep -v ' w ' | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "max glibc symbol: $max"
          [ "$(printf '%s\nGLIBC_2.35\n' "$max" | sort -V | tail -1)" = GLIBC_2.35 ]
          out=$(docker run --rm -v "$PWD/target/debug:/w:ro" ubuntu:22.04 sh -c \
            'apt-get update -qq && apt-get install -y -qq libfontconfig1 libssl3 >/dev/null && ldd /w/luma' 2>&1)
          echo "$out"
          ! echo "$out" | grep -q "not found"

      # #[ignore] tests need downloaded ML models and stay skipped.
      - name: Test
        run: cargo test --locked

      # Manual runs only (`gh workflow run ci.yml -f speech=true`).
      - name: Speech model on real speech
        if: ${{ inputs.speech }}
        run: |
          sudo apt-get install -y espeak-ng
          espeak-ng -w /tmp/speech.wav "The quick brown fox jumps over the lazy dog"
          SPEECH_AUDIO=/tmp/speech.wav cargo test --locked speech_live -- --ignored --nocapture

      # TODO: add `-- -D warnings` once fix/build-warnings is merged.
      - name: Clippy
        run: cargo clippy --locked --all-targets

  # RustSec advisories for Cargo.lock: fails on vulnerabilities, unmaintained
  # crates are only warnings. Needs no build, so no native deps here.
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit
        run: cargo audit
