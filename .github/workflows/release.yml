name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    # Oldest supported glibc (2.35, Mint 21 / Debian 12): the binary needs at most the
    # glibc it was built against. ONNX Runtime is downloaded at runtime, not linked.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build g++ pkg-config \
            libnuma-dev libxkbcommon-dev libfontconfig1-dev libgl1-mesa-dev libxcb1-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Rename artifact
        run: |
          ARTIFACT="luma-$(uname -m)"
          cp target/release/luma "$ARTIFACT"
          # Checked by install.sh before the binary is installed.
          sha256sum "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
